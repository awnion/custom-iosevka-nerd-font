name: Fork release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FONT_NAME: afio

jobs:
  build:
    if: github.event.repository.fork == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: afio-builder:local
          cache-from: type=gha,scope=fork-builder
          cache-to: type=gha,scope=fork-builder,mode=max

      - name: Restore verda cache
        uses: actions/cache@v5
        with:
          path: .verda-cache
          key: verda-v2-${{ runner.os }}-${{ hashFiles('Dockerfile') }}-${{ hashFiles('private-build-plans.toml') }}
          restore-keys: |
            verda-v2-${{ runner.os }}-${{ hashFiles('Dockerfile') }}-

      - name: Build font
        env:
          IMAGE_REF: afio-builder:local
          VERDA_CACHE: .verda-cache
        run: ./build.sh

      - name: Publish latest build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          TAG="build-${BUILD_NUMBER}"
          ASSET="_output/${FONT_NAME}-latest.zip"
          mv _output/"${FONT_NAME}"-*.zip "$ASSET"
          cat > /tmp/release-notes.md <<NOTES
          Build ${BUILD_NUMBER} from commit ${GITHUB_SHA}.

          Download: https://github.com/${GH_REPO}/releases/latest/download/${FONT_NAME}-latest.zip

          Install: extract the TTF files into your fonts directory.
          On Linux, run \`fc-cache -f\` afterwards.

          Built automatically from this fork's main branch.
          NOTES
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Latest build ${BUILD_NUMBER}" \
            --latest \
            --notes-file /tmp/release-notes.md

      - name: Upload patch logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patch-logs
          path: _output/patch.*.log
          if-no-files-found: ignore
